<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dungeon Raid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: none
    }

    #levelCompleteScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 20, 10, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-family: monospace;
    }

    #levelCompleteScreen h1 {
      color: #30e050;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(48, 224, 80, 0.5);
    }

    #levelCompleteScreen p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 40px;
    }

    #nextLevelBtn {
      padding: 15px 40px;
      font-size: 20px;
      font-family: monospace;
      background: linear-gradient(135deg, #2d5a3d, #1a3d2a);
      color: #30e050;
      border: 2px solid #30e050;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #nextLevelBtn:hover {
      background: linear-gradient(135deg, #3d7a4d, #2a5d3a);
      box-shadow: 0 0 20px rgba(48, 224, 80, 0.4);
      transform: scale(1.05);
    }

    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      font-family: monospace;
      color: #30e050;
    }

    #loadingScreen h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #loadingScreen .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1a3d2a;
      border-top-color: #30e050;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #gameCompleteScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(20, 10, 0, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-family: monospace;
    }

    #gameCompleteScreen h1 {
      color: #ffd700;
      font-size: 56px;
      margin-bottom: 20px;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }

    #gameCompleteScreen p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 40px;
    }

    #restartBtn {
      padding: 15px 40px;
      font-size: 20px;
      font-family: monospace;
      background: linear-gradient(135deg, #5a4d2d, #3d2a1a);
      color: #ffd700;
      border: 2px solid #ffd700;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #restartBtn:hover {
      background: linear-gradient(135deg, #7a6d4d, #5d4a2a);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>

  <div id="loadingScreen">
    <h2>Loading Level...</h2>
    <div class="spinner"></div>
  </div>

  <div id="levelCompleteScreen">
    <h1>LEVEL CLEARED!</h1>
    <p id="levelStats">All enemies eliminated</p>
    <button id="nextLevelBtn">Continue to Next Level</button>
  </div>

  <div id="gameCompleteScreen">
    <h1>CAMPAIGN COMPLETE!</h1>
    <p>You have conquered all levels!</p>
    <button id="restartBtn">Play Again</button>
  </div>

  <script src="game.js"></script>
</body>

</html>
